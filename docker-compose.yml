# Docker Compose — Full Stack Portfolio with Redis, MongoDB & Healthchecks
# Run: docker compose up --build
# Access: Client → http://localhost:5173 | Admin → http://localhost:5174 | API → http://localhost:4000

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Redis In-Memory Cache Tier
  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Backend API Service
  backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/portfolio
      - REDIS_URL=redis://redis:6379
      - ADMIN_TOKEN=${ADMIN_TOKEN:-admin-secret-token}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
      - CLIENT_URL=http://localhost:5173
      - ADMIN_URL=http://localhost:5174
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Client Portfolio Site
  client:
    build: ./frontend/client
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Admin Control Center
  admin:
    build: ./frontend/admin
    container_name: portfolio-admin
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
