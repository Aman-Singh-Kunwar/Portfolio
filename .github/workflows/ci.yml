name: CI / Enterprise Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        run: npm --prefix backend install

      - name: Install Client Frontend Dependencies
        run: npm --prefix frontend/client install

      - name: Install Admin Frontend Dependencies
        run: npm --prefix frontend/admin install

      - name: Backend Syntax & Architecture Check
        run: npm --prefix backend run check

      - name: Run Workspace Typecheck
        run: npm run typecheck

      - name: Run Backend Integration & Swagger Tests
        run: npm --prefix backend test

      - name: Run Client Frontend Architecture Tests
        run: npm --prefix frontend/client test

      - name: Run Admin Frontend Architecture Tests
        run: npm --prefix frontend/admin test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E Tests
        run: npm run test:e2e

      - name: Build Client Production Bundle
        run: npm --prefix frontend/client run build

      - name: Build Admin Production Bundle
        run: npm --prefix frontend/admin run build

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Root Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Backend Dependency Security Audit
        run: npm --prefix backend audit --audit-level=high

      - name: Client Dependency Security Audit
        run: npm --prefix frontend/client audit --audit-level=high

      - name: Admin Dependency Security Audit
        run: npm --prefix frontend/admin audit --audit-level=high
