name: CI / Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build, Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Root Dependencies
        run: npm ci || npm install

      - name: 📦 Install Backend Dependencies
        run: npm --prefix backend ci || npm --prefix backend install

      - name: 📦 Install Client Frontend Dependencies
        run: npm --prefix frontend/client ci || npm --prefix frontend/client install

      - name: 📦 Install Admin Frontend Dependencies
        run: npm --prefix frontend/admin ci || npm --prefix frontend/admin install

      - name: 🔍 Backend Syntax & Architecture Check
        run: npm --prefix backend run check

      - name: 🧪 Run Backend Integration Tests
        run: npm --prefix backend test

      - name: 🧪 Run Client Frontend Tests
        run: npm --prefix frontend/client test

      - name: 🧪 Run Admin Frontend Tests
        run: npm --prefix frontend/admin test

      - name: 🏗️ Build Client Frontend
        run: npm --prefix frontend/client run build

      - name: 🏗️ Build Admin Frontend
        run: npm --prefix frontend/admin run build
