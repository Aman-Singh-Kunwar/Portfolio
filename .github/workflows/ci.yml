name: CI / Enterprise Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Typecheck, Test & Docker Verification
    runs-on: ubuntu-latest

    env:
      PORT: 4000
      ADMIN_TOKEN: admin-secret-token
      NODE_ENV: development

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend/client install
          npm --prefix frontend/admin install

      - name: Backend Syntax & Architecture Check
        run: npm --prefix backend run check

      - name: Workspace Typecheck
        run: npm run typecheck

      - name: Backend Integration Tests
        run: npm --prefix backend test

      - name: Client Frontend Architecture Tests
        run: npm --prefix frontend/client test

      - name: Admin Frontend Architecture Tests
        run: npm --prefix frontend/admin test

      - name: Build Client Production Bundle
        run: npm --prefix frontend/client run build

      - name: Build Admin Production Bundle
        run: npm --prefix frontend/admin run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E Tests
        run: npm run test:e2e

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true
